<!DOCTYPE html>
<html lang="pt-BR" data-theme="light">
<head>
<meta charset="utf-8">
<title>RRB Escola · Login</title>
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,400;12..96,500;12..96,600;12..96,700;12..96,800&family=Geist:wght@300;400;500;600;700&family=Geist+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="src/rrb-tokens.css">
<style>
  html, body { height: 100%; }
  #root { height: 100%; }

  /* ---- Login layout ---- */
  .lg-root { overflow: hidden; }
  .lg-left { flex: 1.14; position: relative; display: flex; padding: 60px 56px; border-right: 1px solid var(--border); }
  .lg-left-content { margin: auto 0; width: 100%; }
  .lg-right { flex: 1; display: flex; align-items: center; justify-content: center; padding: 40px; background: var(--surface); }
  .lg-card { width: 100%; max-width: 396px; }

  .lg-stats { margin-top: 26px; border: 1px solid var(--border); border-radius: 14px; background: var(--surface-2); padding: 4px 15px; box-shadow: var(--shadow-xs); }
  .lg-stat-row { display: flex; justify-content: space-between; align-items: center; padding: 12px 0; border-bottom: 1px solid var(--border-soft); }
  .lg-stat-row:last-child { border-bottom: none; }

  /* aurora blobs */
  .aurora { position: absolute; inset: 0; pointer-events: none; }
  .aurora span { position: absolute; border-radius: 50%; filter: blur(72px); opacity: .5; animation: lgdrift 16s var(--ease) infinite alternate; }
  @keyframes lgdrift { 0% { transform: translate(0,0) scale(1); } 100% { transform: translate(34px,28px) scale(1.14); } }

  /* spotlight */
  .orb { position: absolute; border-radius: 50%; filter: blur(80px); opacity: .42; animation: lgdrift 18s var(--ease) infinite alternate; pointer-events: none; }
  .dots { position: absolute; inset: 0; opacity: .5;
    background-image: radial-gradient(color-mix(in oklab, var(--brand-glow) 26%, transparent) 1px, transparent 1.4px);
    background-size: 26px 26px; -webkit-mask-image: radial-gradient(80% 70% at 30% 30%, #000, transparent 75%); mask-image: radial-gradient(80% 70% at 30% 30%, #000, transparent 75%); }

  /* entrance */
  .reveal { opacity: 0; transform: translateY(16px); animation: lgReveal .7s var(--ease-out) forwards; animation-delay: var(--d, 0ms); }
  @keyframes lgReveal { to { opacity: 1; transform: none; } }

  /* page chrome */
  body { background: var(--bg); }
  .page-head { padding: 26px 30px 6px; }
  .page-head h1 { font-family: var(--font-display); font-weight: 700; font-size: 22px; letter-spacing: -0.02em; margin: 0; color: var(--text); }
  .page-head p { font-size: 13px; color: var(--text-muted); margin: 5px 0 0; }
</style>
<script src="https://unpkg.com/react@18.3.1/umd/react.development.js" integrity="sha384-hD6/rw4ppMLGNu3tX5cjIb+uRZ7UkRJ6BPkLpg4hAu/6onKUg4lLsHAs9EBPT82L" crossorigin="anonymous"></script>
<script src="https://unpkg.com/react-dom@18.3.1/umd/react-dom.development.js" integrity="sha384-u6aeetuaXnQ38mYT8rp6sbXaQe3NL9t+IBXmnYxwkUI2Hw4bsp2Wvmx4yRQF1uAm" crossorigin="anonymous"></script>
<script src="https://unpkg.com/@babel/standalone@7.29.0/babel.min.js" integrity="sha384-m08KidiNqLdpJqLq95G/LEi8Qvjl/xUYll3QILypMoQ65QorJ9Lvtp2RXYGBFj1y" crossorigin="anonymous"></script>
<script type="text/babel" src="src/design-canvas.jsx"></script>
<script type="text/babel" src="src/login.jsx"></script>
</head>
<body>
<template id="__bundler_thumbnail" data-bg-color="#2348C9">
  <svg viewBox="0 0 240 240" xmlns="http://www.w3.org/2000/svg">
    <rect width="240" height="240" rx="40" fill="#2348C9"></rect>
    <path d="M120 60 L180 90 V180 H60 V90 Z" fill="#fff"></path>
    <rect x="104" y="120" width="32" height="60" fill="#2348C9"></rect>
  </svg>
</template>
<div id="root"></div>
<script type="text/babel">
  function App() {
    return (
      <DesignCanvas>
        <DCSection id="login" title="Login — RRB Escola" subtitle="Duas direções · A em tema claro, B em tema escuro. Abra em foco (←/→) para ver inteira.">
          <DCArtboard id="aurora"    label="A · Aurora (claro)"   width={1240} height={760}><LoginScreen variant="aurora" /></DCArtboard>
          <DCArtboard id="spotlight" label="B · Spotlight (escuro)" width={1240} height={760}><LoginScreen variant="spotlight" /></DCArtboard>
        </DCSection>
      </DesignCanvas>
    );
  }
  ReactDOM.createRoot(document.getElementById('root')).render(<App />);
</script>
</body>
</html>
